[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hg_estimator"
version = "0.0.0"
description = "Estimate Hermite-Gauss mode coefficients from intensity images taken through a (tilted) lens."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
